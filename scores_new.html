<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Kenny vs Spenny - Enhanced Scores</title>
        <link rel="icon" type="image/x-icon" href="/kvs.ico">
        <link rel="stylesheet" type="text/css" href="kvs.css">
        <link rel="stylesheet" type="text/css" href="scores_new.css">
        <script src="rollovers.js" defer></script>
        <script src="scores_new.js" defer></script>
    </head>
    <body onload="setupRollovers();">
        <div class="scores-site">
            <header class="scores-header">
                <img src="media/header/home_header_kenny.gif" alt="Kenny" width="151" height="165"><a href="index.html"><img src="media/header/home_header_kvs.jpg" alt="Kenny vs. Spenny" width="438" height="165"></a><img src="media/header/home_header_spenny.gif" alt="Spenny" width="161" height="165">
            </header>
            <nav class="scores-nav" aria-label="Main navigation">
                <img src="media/navbar/nav_filler.gif" alt="" width="48" height="30"><a href="competitions.html"><img src="media/navbar/nav_competitions_off.gif" hsrc="media/navbar/nav_competitions_on.gif" alt="Competitions" width="141" height="30"></a><img src="media/navbar/nav_filler.gif" alt="" width="25" height="30"><a href="bios.html"><img src="media/navbar/nav_bios_off.gif" hsrc="media/navbar/nav_bios_on.gif" alt="Bios" width="54" height="30"></a><img src="media/navbar/nav_filler.gif" alt="" width="25" height="30"><a href="freebies.html"><img src="media/navbar/nav_freebies_off.gif" hsrc="media/navbar/nav_freebies_on.gif" alt="Freebies" width="100" height="30"></a><img src="media/navbar/nav_filler.gif" alt="" width="25" height="30"><a href="outtakes.html"><img src="media/navbar/nav_outtakes_off.gif" hsrc="media/navbar/nav_outtakes_on.gif" alt="Outtakes" width="106" height="30"></a><img src="media/navbar/nav_filler.gif" alt="" width="25" height="30"><a href="game_new.html"><img src="media/navbar/nav_versusville_off.gif" hsrc="media/navbar/nav_versusville_on.gif" alt="Play the Game" width="152" height="30"></a><img src="media/navbar/nav_filler.gif" alt="" width="49" height="30">
            </nav>
            <main class="scores-content">
                <h1 class="scores-title"><img src="media/subheaders/scoreboard.jpg" alt="Versusville Scoreboard" width="750" height="75"></h1>
                <img class="scores-lineup" src="media/versusville/game_scores_lineup.gif" alt="" width="408" height="173">
                <p>Versusville Enhanced Scoreboards</p>
                <div class="scores-links smalltext">
                    <a href="scores.html">Click here to view the final scoreboard from 2005</a>
                    <a href="#custom-server" id="custom-server-link" aria-haspopup="dialog">Click here to view a custom IP</a>
                </div>
                <div class="scores-source smalltext">
                    <span id="scores-source">play.versusville.com</span>
                    <button type="button" id="scores-refresh">Refresh</button>
                </div>
                <p id="scores-status" role="status">Loading scores...</p>
                <div id="scoreboards" class="scoreboards" aria-busy="true"></div>
                <noscript><p>JavaScript is required to load the live scoreboards.</p></noscript>
            </main>
        </div>
        <dialog id="custom-server" aria-labelledby="custom-server-title">
            <form id="custom-server-form">
                <h2 id="custom-server-title">Custom server</h2>
                <label for="custom-server-url">Server address</label>
                <input id="custom-server-url" name="server" type="text" required autocomplete="off" spellcheck="false" placeholder="https://play.versusville.com" aria-describedby="custom-server-error">
                <p id="custom-server-error" role="alert" hidden></p>
                <div class="scores-dialog-actions">
                    <button type="button" id="custom-server-cancel">Cancel</button>
                    <button type="submit">View scores</button>
                </div>
            </form>
        </dialog>
    </body>
</html>
